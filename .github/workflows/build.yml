name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o *.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          cd "$(dirname "$(find project -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --console=plain > build.log 2>&1 || { grep -m1 -A15 "What went wrong" build.log; grep "^e: " build.log | head -20; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bxt-debug
          path: project/**/build/outputs/apk/debug/*.apk
